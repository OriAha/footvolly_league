name: League updates → push notifications

on:
  schedule:
    - cron: '*/10 * * * *'   # GitHub may run scheduled jobs a few minutes late
  workflow_dispatch:

concurrency:
  group: league-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web-push
        working-directory: scripts
        run: npm install --no-save --no-package-lock web-push@3.6.7
      - name: Check league and notify
        working-directory: scripts
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: node watch.mjs
